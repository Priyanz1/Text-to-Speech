# Render Blueprint - infrastructure as code for the API.
#
# Why a blueprint instead of clicking through the dashboard: the deploy
# configuration is reviewable in a pull request, and it can be recreated exactly
# if the service is ever deleted or moved to another account.
#
# To use: Render dashboard -> New -> Blueprint -> pick this repository.
# Render reads this file from the repository root.
#
# The client is NOT here. It is a static React app deployed to Vercel, which is
# better at that job (global CDN, preview deployments per branch).

services:
  - type: web
    name: tts-saas-api
    runtime: node

    # Free instances sleep after ~15 minutes of inactivity and take 30-60s to
    # wake. Fine for now; upgrade before real users arrive.
    plan: free

    # Closest Render region to India. Keep the MongoDB Atlas region matching -
    # every query pays that round trip, so API-to-database distance costs more
    # than user-to-API distance.
    region: singapore

    # The repository root holds both packages, so point Render at the server.
    rootDir: server

    # `npm ci` not `npm install`: it installs exactly what package-lock.json
    # says, so a deploy can never silently pick up a different version.
    buildCommand: npm ci
    startCommand: npm start

    # LIVENESS, deliberately - not /api/ready.
    #
    # Render restarts an instance that fails this check. Restarting the API
    # cannot fix a MongoDB outage, so pointing this at a database-dependent
    # endpoint would turn a database blip into a restart loop. /api/health
    # answers only "is this process alive", which is the question Render is
    # really asking.
    healthCheckPath: /api/health

    autoDeploy: true

    envVars:
      - key: NODE_ENV
        value: production

      - key: LOG_LEVEL
        value: info

      # `sync: false` means: this key is declared here, but its VALUE is set in
      # the Render dashboard and never stored in git. This is how the Atlas
      # credentials stay out of the repository.
      - key: MONGODB_URI
        sync: false

      # The deployed frontend origin, e.g. https://your-app.vercel.app
      # No trailing slash. Set in the dashboard so a domain change needs no
      # commit.
      - key: CLIENT_URL
        sync: false

      # Optional. Comma-separated extra origins allowed through CORS - used for
      # Vercel preview deployments. Leave unset in production if you do not
      # want preview builds talking to the production database.
      - key: CORS_EXTRA_ORIGINS
        sync: false

      # Signs access tokens. `generateValue: true` has Render mint a random
      # value on first deploy and keep it thereafter, so it never exists in git
      # and nobody has to invent one.
      #
      # Changing it later signs everyone out - every issued access token stops
      # verifying. Refresh tokens are unaffected (they are opaque, not signed),
      # so the next refresh quietly repairs the session.
      - key: JWT_SECRET
        generateValue: true

      # Email delivery. Leave EMAIL_PROVIDER as `log` until a Resend account and
      # a verified sending domain exist - with `resend` and no API key the
      # process refuses to boot, which is the intended behaviour but a confusing
      # first deploy. Set EMAIL_FROM to an address on the verified domain.
      - key: EMAIL_PROVIDER
        value: log

      - key: EMAIL_FROM
        sync: false

      - key: RESEND_API_KEY
        sync: false

      # Speech generation. Left as `mock` on purpose: with `google` and no key
      # the process refuses to boot, and a first deploy should not depend on a
      # billing account existing. Flip it to `google` in the dashboard once
      # GOOGLE_SERVICE_ACCOUNT_JSON is set.
      - key: TTS_PROVIDER
        value: mock

      # A Google Cloud service-account private key, as raw JSON on one line or
      # base64. `sync: false` keeps it in the dashboard and out of git. The
      # browser never sees it - only this service talks to Google.
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false

      # Render's free plan has an EPHEMERAL filesystem: generated audio survives
      # until the next deploy or restart, then vanishes. The Generation records
      # remain, so the history is intact and only playback of old files breaks.
      # Object storage (S3 or R2) is the fix when this matters; the storage
      # adapter exists so that is one new file, not a rewrite.
      - key: STORAGE_PROVIDER
        value: local

      # The S3-compatible bucket, used only once STORAGE_PROVIDER is `s3`. All
      # `sync: false`: the key pair is a secret, and the bucket, region and
      # endpoint differ per provider (AWS wants a real region and no endpoint,
      # Cloudflare R2 wants `auto` and an account endpoint). Unset here means the
      # defaults in src/config/env.js apply, and `local` ignores them anyway.
      #
      # The bucket must be PRIVATE. Audio is served through
      # GET /api/generations/:id/audio after an ownership check.
      - key: S3_BUCKET
        sync: false

      - key: S3_REGION
        sync: false

      - key: S3_ENDPOINT
        sync: false

      - key: S3_ACCESS_KEY_ID
        sync: false

      - key: S3_SECRET_ACCESS_KEY
        sync: false

      - key: S3_FORCE_PATH_STYLE
        sync: false

      # Payments. Left as `mock` for the same reason as TTS_PROVIDER: with
      # `razorpay` and no webhook secret the process refuses to boot, which is
      # correct but a poor first deploy. Flip it to `razorpay` in the dashboard
      # once all three keys below are set.
      #
      # Test mode and live mode are the same code path - the mode lives in the
      # key pair. Going live means replacing rzp_test_ values with rzp_live_
      # ones and re-pointing the webhook, with no commit.
      - key: PAYMENT_PROVIDER
        value: mock

      # Public - the browser needs it to open Checkout - but it identifies the
      # account, so test and live values must not be mixed up.
      - key: RAZORPAY_KEY_ID
        sync: false

      - key: RAZORPAY_KEY_SECRET
        sync: false

      # The webhook is the ONLY thing that grants purchased credits, so this is
      # what stands between a paid order and a free credit endpoint. A different
      # secret from RAZORPAY_KEY_SECRET, chosen when the webhook is added in the
      # Razorpay dashboard.
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false

      # Hardening. Declared explicitly rather than left to its default, because
      # this is the one setting whose accidental `false` in production is
      # invisible until someone is brute-forcing logins.
      - key: RATE_LIMIT_ENABLED
        value: 'true'

      # TTS_MAX_INPUT_BYTES and GENERATED_AUDIO_DIR use their defaults (4800
      # bytes, under Google's 5000 ceiling, and server/tmp/audio). So do
      # JSON_BODY_LIMIT (100kb) and the four RATE_LIMIT_* windows and ceilings -
      # see server/.env.example for what each one counts.

      # ACCESS_TOKEN_TTL, REFRESH_TOKEN_TTL_DAYS, BCRYPT_COST, the two token
      # TTLs and COOKIE_SAMESITE are all left to their defaults. COOKIE_SAMESITE
      # matters most: unset, it resolves to `none` + Secure in production, which
      # is what lets the Vercel client send the refresh cookie to Render at all.

    # PORT is intentionally absent: Render injects it, and src/config/env.js
    # reads whatever it is given.
